name: Build NanoPi R28S OpenWrt 25.12.5

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-dev \
            python3-setuptools python3-pyelftools rsync unzip zlib1g-dev \
            file wget curl swig time device-tree-compiler ccache \
            libelf-dev qemu-utils

      - name: Validate project
        run: |
          python3 -m py_compile scripts/*.py
          python3 scripts/validate-project.py

      - name: Build
        run: |
          ./scripts/build.sh

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: nanopi-r28s-openwrt-25.12.5
          path: output/*
          if-no-files-found: error
          retention-days: 30
