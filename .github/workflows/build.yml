name: Build NanoPi R28S OpenWrt 25.12.5

# Manual only: every push used to start a ~70 minute build, including pushes
# that only touched a log file.
on:
  workflow_dispatch:

# Creating the release needs a token that may write repository contents.
permissions:
  contents: write

# A second dispatch supersedes the first; do not pay for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      # build.sh turns this into CONFIG_CCACHE_DIR; rules.mk only reads the
      # config value, so the variable has to be passed through the script.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-dev \
            python3-setuptools python3-pyelftools rsync unzip zlib1g-dev \
            file wget curl swig time device-tree-compiler ccache \
            libelf-dev qemu-utils

      - name: Validate project
        run: |
          python3 -m py_compile scripts/*.py
          python3 scripts/validate-project.py

      # Host tools and the cross toolchain are ~35 of the ~50 minutes the build
      # spends before it even starts compiling packages. They are a pure
      # function of the OpenWrt tag and the config, so cache them verbatim.
      # All three stamp locations have to be restored: OpenWrt gates a component
      # on .configured -> .built in build_dir and only _installed in
      # staging_dir, so a partial restore rebuilds the component anyway.
      # build.sh preserves these across the re-clone.
      - name: Restore host tools and toolchain
        id: buildstate
        uses: actions/cache/restore@v4
        with:
          path: |
            .work/openwrt/staging_dir/host
            .work/openwrt/staging_dir/toolchain-*
            .work/openwrt/build_dir/host
            .work/openwrt/build_dir/toolchain-*
          key: openwrt-buildstate-${{ hashFiles('config/r28s.config') }}

      # Feed checkouts cost a few minutes of cloning per run and do not depend
      # on the config at all, only on the pinned OpenWrt tag in build.sh.
      - name: Restore OpenWrt feeds
        id: feeds
        uses: actions/cache/restore@v4
        with:
          path: .work/openwrt/feeds
          key: openwrt-feeds-${{ hashFiles('scripts/build.sh') }}

      # ccache deliberately uses a rolling key: it has to be rewritten every run
      # to keep growing. restore-keys always gives the newest matching prefix.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ github.ref }}-
            ccache-refs/heads/main-

      - name: Build
        run: ./scripts/build.sh

      # actions/cache/save fails outright when a path does not exist, which
      # would mask the real error when the build dies before it ever compiles
      # anything. Decide what is worth saving first.
      - name: Check which caches can be saved
        id: cacheable
        if: always()
        run: |
          if [[ -d .work/openwrt/staging_dir && -d .work/openwrt/build_dir ]]; then
            echo "buildstate=true" >> "$GITHUB_OUTPUT"
          else
            echo "buildstate=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -d .work/openwrt/feeds ]]; then
            echo "feeds=true" >> "$GITHUB_OUTPUT"
          else
            echo "feeds=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -d .ccache ]]; then
            echo "ccache=true" >> "$GITHUB_OUTPUT"
          else
            echo "ccache=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save host tools and toolchain
        if: always() && steps.cacheable.outputs.buildstate == 'true' && steps.buildstate.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .work/openwrt/staging_dir/host
            .work/openwrt/staging_dir/toolchain-*
            .work/openwrt/build_dir/host
            .work/openwrt/build_dir/toolchain-*
          key: openwrt-buildstate-${{ hashFiles('config/r28s.config') }}

      - name: Save OpenWrt feeds
        if: always() && steps.cacheable.outputs.feeds == 'true' && steps.feeds.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .work/openwrt/feeds
          key: openwrt-feeds-${{ hashFiles('scripts/build.sh') }}

      - name: Save ccache
        if: always() && steps.cacheable.outputs.ccache == 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ github.ref }}-${{ github.run_id }}

      # The two sysupgrade images are published as separate release assets
      # rather than as one artifact zip, so each can be downloaded on its own.
      # The build date goes into the tag and into the file names so builds on
      # different days never collide; a second build on the same day replaces
      # the assets instead of failing.
      - name: Publish firmware release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%d)"
          tag="25.12.5-${stamp}"

          mkdir -p release
          shopt -s nullglob
          for f in output/*-sysupgrade.img.gz; do
            base="$(basename "$f" .img.gz)"
            cp -v "$f" "release/${base}-${stamp}.img.gz"
          done

          assets=( release/*.img.gz )
          if (( ${#assets[@]} != 2 )); then
            echo "ERROR: expected 2 images, found ${#assets[@]}" >&2
            exit 2
          fi

          notes="Built at $(date -u +%Y-%m-%dT%H:%M:%SZ) from ${GITHUB_SHA}."

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --title "NanoPi R28S OpenWrt 25.12.5 (${stamp})" \
              --notes "$notes"
          fi
